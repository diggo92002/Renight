<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>夜聲 — 睡前聲音播放器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111512;
      --panel: #1a211c;
      --panel-soft: #202a23;
      --line: #303c33;
      --text: #f1f2e9;
      --muted: #a4aea3;
      --accent: #c7dda9;
      --accent-dark: #263325;
      --warm: #e8c99c;
      --danger: #efb0a4;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px 42px;
      color: var(--text);
      background: radial-gradient(ellipse at 50% -18%, #2c3a2d 0, transparent 54%), var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .app { width: min(100%, 560px); margin: auto; }
    header { text-align: center; margin: 8px 0 24px; }
    .eyebrow { color: var(--accent); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 8vw, 2.65rem); line-height: 1.1; margin: 10px 0 8px; letter-spacing: -.045em; }
    .intro { color: var(--muted); margin: 0 auto; max-width: 390px; line-height: 1.65; font-size: .92rem; }
    .player {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(155deg, #1d281f, #171d19 70%);
      box-shadow: 0 22px 70px #0005;
    }
    .hero { padding: 24px 24px 22px; text-align: center; }
    .orb-wrap { height: 170px; display: grid; place-items: center; position: relative; }
    .orb {
      width: 124px; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #eff4d6, #c6dbaa 29%, #809c70 59%, #415342 78%, #28372c);
      box-shadow: 0 0 0 1px #e5f0cd30, 0 0 42px #b8d89e26, inset -10px -15px 30px #10171080;
      transition: transform 1.8s ease, box-shadow 1.8s ease;
    }
    .orb::after { content: ""; display: block; width: 100%; height: 100%; border-radius: inherit; background: radial-gradient(circle at 30% 25%, #fff5, transparent 44%); }
    .playing .orb { animation: breathe 6s ease-in-out infinite; box-shadow: 0 0 0 14px #c7dda90c, 0 0 65px #b8d89e35, inset -10px -15px 30px #10171080; }
    @keyframes breathe { 50% { transform: scale(1.075); } }
    .readout { color: var(--warm); font-size: .78rem; letter-spacing: .13em; }
    .frequency { font-size: 1.1rem; margin: 7px 0 0; font-variant-numeric: tabular-nums; }
    .frequency span { color: var(--muted); font-size: .82rem; }
    .controls { padding: 22px 24px 24px; border-top: 1px solid var(--line); }
    .label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 11px; }
    label, .control-title { font-size: .88rem; font-weight: 600; }
    output, .hint { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 23px; }
    .preset {
      border: 1px solid var(--line); border-radius: 13px; padding: 11px 8px;
      color: var(--text); background: #151b17; cursor: pointer; text-align: left; transition: .18s ease;
    }
    .preset:hover { background: var(--panel-soft); border-color: #66745f; }
    .preset[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dark); box-shadow: inset 0 0 0 1px #c7dda91f; }
    .preset strong { display: block; font-size: .87rem; }
    .preset span { display: block; color: var(--muted); font-size: .7rem; margin-top: 4px; }
    .range { width: 100%; height: 24px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .range-ends { display: flex; justify-content: space-between; color: #879287; font-size: .69rem; margin-top: 2px; }
    .control { margin-top: 20px; }
    .select-wrap { position: relative; }
    select {
      width: 100%; color: var(--text); background: #151b17; border: 1px solid var(--line); border-radius: 11px;
      padding: 12px 40px 12px 13px; appearance: none; cursor: pointer;
    }
    .select-wrap::after { content: "⌄"; pointer-events: none; position: absolute; right: 14px; top: 7px; color: var(--muted); font-size: 1.2rem; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .toggle-copy strong { display: block; font-size: .86rem; }
    .toggle-copy span { display: block; color: var(--muted); font-size: .72rem; margin-top: 3px; }
    .switch { appearance: none; width: 44px; height: 26px; border: 1px solid #596359; border-radius: 20px; background: #343d35; cursor: pointer; position: relative; flex: 0 0 auto; transition: .2s; }
    .switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c1c9bc; transition: .2s; }
    .switch:checked { background: #667d55; border-color: #9bb382; }
    .switch:checked::before { transform: translateX(18px); background: white; }
    .play-row { margin-top: 25px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    #playButton {
      border: 0; border-radius: 14px; min-height: 54px; padding: 12px 18px; background: var(--accent); color: #182117;
      font-weight: 750; cursor: pointer; transition: filter .2s, transform .15s;
    }
    #playButton:hover { filter: brightness(1.07); }
    #playButton:active { transform: scale(.985); }
    #playButton.stop { background: #53342f; color: #ffe8e0; }
    .countdown { color: var(--muted); font-size: .78rem; text-align: right; min-width: 82px; font-variant-numeric: tabular-nums; }
    .status { min-height: 22px; margin: 12px 0 0; text-align: center; color: var(--muted); font-size: .78rem; }
    .notice { display: flex; align-items: flex-start; gap: 10px; margin: 15px 0 0; padding: 13px 14px; border-radius: 12px; background: #26261e; color: #cecbb9; font-size: .75rem; line-height: 1.5; }
    .notice b { color: var(--warm); font-size: .9rem; }
    .foot { text-align: center; color: #7f8a7e; font-size: .72rem; line-height: 1.6; margin: 16px 6px 0; }
    .hidden { display: none !important; }
    @media (max-width: 430px) { body { padding: 18px 12px 28px; } .hero { padding-top: 18px; } .controls { padding: 20px 17px; } .two-col { gap: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">A quieter end to the day</div>
      <h1>夜聲</h1>
      <p class="intro">調一段舒服的聲音，讓今晚慢慢安靜下來。</p>
    </header>

    <section class="player" id="player" aria-label="睡前聲音播放器">
      <div class="hero">
        <div class="orb-wrap"><div class="orb" aria-hidden="true"></div></div>
        <div class="readout" id="modeReadout">THETA · 6 HZ</div>
        <p class="frequency"><span id="leftFreq">197</span> Hz 左耳 <span aria-hidden="true">·</span> <span id="rightFreq">203</span> Hz 右耳</p>
      </div>
      <div class="controls">
        <div class="control-title" id="presetLabel">選擇一段節拍</div>
        <div class="presets" role="group" aria-labelledby="presetLabel">
          <button class="preset" type="button" data-mode="delta" data-beat="2" aria-pressed="false"><strong>深夜</strong><span>Delta · 2 Hz</span></button>
          <button class="preset" type="button" data-mode="theta" data-beat="6" aria-pressed="true"><strong>放鬆</strong><span>Theta · 6 Hz</span></button>
          <button class="preset" type="button" data-mode="alpha" data-beat="10" aria-pressed="false"><strong>舒緩</strong><span>Alpha · 10 Hz</span></button>
        </div>

        <div class="control">
          <div class="label-row"><label for="beatRange">節拍頻率</label><output id="beatOutput" for="beatRange">6 Hz · Theta</output></div>
          <input class="range" type="range" id="beatRange" min="1" max="12" step="0.5" value="6">
          <div class="range-ends"><span>1 Hz</span><span>12 Hz</span></div>
        </div>
        <div class="control">
          <div class="label-row"><label for="volumeRange">音量</label><output id="volumeOutput" for="volumeRange">20%</output></div>
          <input class="range" type="range" id="volumeRange" min="0" max="0.4" step="0.01" value="0.2">
          <div class="range-ends"><span>很輕</span><span>請保持舒適音量</span></div>
        </div>

        <div class="two-col control">
          <div>
            <label for="timerSelect">播放時間</label>
            <div class="select-wrap" style="margin-top:9px">
              <select id="timerSelect">
                <option value="0">持續播放</option><option value="15">15 分鐘</option><option value="30" selected>30 分鐘</option>
                <option value="45">45 分鐘</option><option value="60">60 分鐘</option><option value="90">90 分鐘</option>
              </select>
            </div>
          </div>
          <div>
            <label for="carrierSelect">音調高低</label>
            <div class="select-wrap" style="margin-top:9px">
              <select id="carrierSelect"><option value="150">低沉</option><option value="200" selected>柔和</option><option value="250">明亮</option></select>
            </div>
          </div>
        </div>

        <div class="control toggle-row">
          <div class="toggle-copy"><strong>加入背景底噪</strong><span>柔和遮蓋環境聲</span></div>
          <input class="switch" type="checkbox" id="noiseToggle" role="switch" aria-label="加入背景底噪">
        </div>
        <div class="control hidden" id="noiseControls">
          <div class="two-col">
            <div><label for="noiseType">底噪音色</label><div class="select-wrap" style="margin-top:9px"><select id="noiseType"><option value="brown">棕色噪音</option><option value="pink">粉紅噪音</option><option value="white">白噪音</option></select></div></div>
            <div><div class="label-row"><label for="noiseVolume">底噪音量</label><output id="noiseOutput" for="noiseVolume">8%</output></div><input class="range" type="range" id="noiseVolume" min="0" max="0.25" step="0.01" value="0.08" style="margin-top:5px"></div>
          </div>
        </div>

        <div class="play-row">
          <button id="playButton" type="button">開始播放</button>
          <div class="countdown" id="countdown" aria-live="polite">尚未播放</div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">戴上立體聲耳機，從低音量開始。</p>
        <div class="notice"><b aria-hidden="true">ⓘ</b><span>雙耳節拍需要立體聲耳機。聲音偏好因人而異，研究結果仍有限；請把它當作放鬆工具，若覺得不舒服就停止聆聽。</span></div>
      </div>
    </section>
    <p class="foot">聲音在你的瀏覽器即時產生，不會上傳或儲存。<br>播放需要點擊開始；定時結束前會逐漸淡出。</p>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const beatRange = $('beatRange'), volumeRange = $('volumeRange'), noiseVolume = $('noiseVolume');
      const player = $('player'), playButton = $('playButton'), status = $('status'), countdown = $('countdown');
      const presets = [...document.querySelectorAll('.preset')];
      let ctx = null, leftOsc = null, rightOsc = null, masterGain = null, toneGain = null;
      let noiseSource = null, noiseGain = null, isPlaying = false, stopTimer = null, clockTimer = null, stopAt = 0, ending = false;
      const bands = [{ name: 'Delta', min: 1, max: 3.5 }, { name: 'Theta', min: 4, max: 7.5 }, { name: 'Alpha', min: 8, max: 12 }];
      const bandName = (hz) => (bands.find((b) => hz >= b.min && hz <= b.max)?.name || '放鬆');
      const beat = () => Number(beatRange.value);
      const carrier = () => Number($('carrierSelect').value);
      const prefs = ['beatRange','volumeRange','timerSelect','carrierSelect','noiseToggle','noiseType','noiseVolume'];

      try {
        const saved = JSON.parse(localStorage.getItem('ye-sheng-settings') || '{}');
        prefs.forEach((id) => { if (saved[id] !== undefined && $(id)) { if ($(id).type === 'checkbox') $(id).checked = !!saved[id]; else $(id).value = saved[id]; } });
      } catch (_) { /* ignore unavailable or malformed local settings */ }
      const savePrefs = () => { try { const data = {}; prefs.forEach((id) => data[id] = $(id).type === 'checkbox' ? $(id).checked : $(id).value); localStorage.setItem('ye-sheng-settings', JSON.stringify(data)); } catch (_) {} };

      function updateReadout() {
        const hz = beat(), base = carrier();
        $('modeReadout').textContent = `${bandName(hz).toUpperCase()} · ${hz.toFixed(hz % 1 ? 1 : 0)} HZ`;
        $('beatOutput').textContent = `${hz.toFixed(hz % 1 ? 1 : 0)} Hz · ${bandName(hz)}`;
        $('leftFreq').textContent = (base - hz / 2).toFixed(1).replace(/\.0$/, '');
        $('rightFreq').textContent = (base + hz / 2).toFixed(1).replace(/\.0$/, '');
        $('volumeOutput').textContent = `${Math.round(Number(volumeRange.value) * 100)}%`;
        $('noiseOutput').textContent = `${Math.round(Number(noiseVolume.value) * 100)}%`;
        presets.forEach((button) => button.setAttribute('aria-pressed', String(Number(button.dataset.beat) === hz)));
      }
      const smoothParam = (param, value) => { if (!ctx || !param) return; param.setTargetAtTime(value, ctx.currentTime, .08); };

      function makeNoiseBuffer(kind) {
        const length = ctx.sampleRate * 4, buffer = ctx.createBuffer(1, length, ctx.sampleRate), data = buffer.getChannelData(0);
        let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
        for (let i=0; i<length; i++) {
          const white = Math.random() * 2 - 1;
          let sample = white;
          if (kind === 'pink') {
            b0=.99886*b0+white*.0555179; b1=.99332*b1+white*.0750759; b2=.969*b2+white*.153852;
            b3=.8665*b3+white*.3104856; b4=.55*b4+white*.5329522; b5=-.7616*b5-white*.016898;
            sample=(b0+b1+b2+b3+b4+b5+b6+white*.5362)*.11; b6=white*.115926;
          } else if (kind === 'brown') { last=(last+.02*white)/1.02; sample=last*3.5; }
          data[i] = sample;
        }
        return buffer;
      }
      function setNoiseEnabled(enabled) {
        if (!ctx || !noiseGain) return;
        if (enabled && !noiseSource) {
          noiseSource = ctx.createBufferSource(); noiseSource.buffer = makeNoiseBuffer($('noiseType').value); noiseSource.loop = true;
          noiseSource.connect(noiseGain); noiseSource.start();
        } else if (!enabled && noiseSource) { try { noiseSource.stop(); } catch (_) {} noiseSource.disconnect(); noiseSource = null; }
        smoothParam(noiseGain.gain, enabled ? Number(noiseVolume.value) : 0);
      }
      function refreshNoise() { if (isPlaying && $('noiseToggle').checked) { setNoiseEnabled(false); setNoiseEnabled(true); } }
      function formatTime(seconds) { const mins = Math.floor(seconds / 60), secs = seconds % 60; return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`; }
      function updateClock() {
        if (!isPlaying) return;
        if (!stopAt) { countdown.textContent = '持續播放'; return; }
        const remaining = Math.max(0, Math.ceil((stopAt - Date.now()) / 1000));
        countdown.textContent = ending ? '正在淡出…' : `剩餘 ${formatTime(remaining)}`;
      }
      function setPlayingUI(playing) {
        isPlaying = playing; player.classList.toggle('playing', playing); playButton.classList.toggle('stop', playing);
        playButton.textContent = playing ? '停止播放' : '開始播放';
        if (!playing) countdown.textContent = '尚未播放';
      }
      async function startAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) { status.textContent = '這個瀏覽器不支援即時音訊，請改用較新的瀏覽器。'; return; }
        try {
          ctx = new AudioContext(); await ctx.resume();
          masterGain = ctx.createGain(); toneGain = ctx.createGain(); noiseGain = ctx.createGain();
          toneGain.gain.value = Number(volumeRange.value); noiseGain.gain.value = $('noiseToggle').checked ? Number(noiseVolume.value) : 0;
          toneGain.connect(masterGain); noiseGain.connect(masterGain); masterGain.gain.value = 1; masterGain.connect(ctx.destination);
          leftOsc = ctx.createOscillator(); rightOsc = ctx.createOscillator(); leftOsc.type = rightOsc.type = 'sine';
          leftOsc.frequency.value = carrier() - beat()/2; rightOsc.frequency.value = carrier() + beat()/2;
          const leftPan = ctx.createStereoPanner(), rightPan = ctx.createStereoPanner(); leftPan.pan.value = -1; rightPan.pan.value = 1;
          leftOsc.connect(leftPan); rightOsc.connect(rightPan); leftPan.connect(toneGain); rightPan.connect(toneGain);
          leftOsc.start(); rightOsc.start();
          if ($('noiseToggle').checked) setNoiseEnabled(true);
          ending = false; const minutes = Number($('timerSelect').value); stopAt = minutes ? Date.now() + minutes*60000 : 0;
          setPlayingUI(true); status.textContent = '正在播放。調整到舒服、偏輕的音量即可。';
          if (minutes) stopTimer = setTimeout(() => fadeOut(true), minutes*60000 - 30000 > 0 ? minutes*60000 - 30000 : minutes*60000);
          if (minutes && minutes*60000 <= 30000) stopTimer = setTimeout(() => fadeOut(true), minutes*60000);
          clearInterval(clockTimer); clockTimer = setInterval(updateClock, 1000); updateClock(); savePrefs();
        } catch (error) { status.textContent = '音訊無法啟動，請再按一次播放。'; await cleanup(); }
      }
      async function cleanup() {
        clearTimeout(stopTimer); clearInterval(clockTimer); stopTimer = clockTimer = null;
        const oldCtx = ctx; ctx = null;
        [leftOsc,rightOsc,noiseSource].forEach((node) => { if (node) { try { node.stop(); } catch (_) {} try { node.disconnect(); } catch (_) {} } });
        leftOsc = rightOsc = noiseSource = null; masterGain = toneGain = noiseGain = null;
        if (oldCtx && oldCtx.state !== 'closed') { try { await oldCtx.close(); } catch (_) {} }
        stopAt = 0; ending = false; setPlayingUI(false);
      }
      function fadeOut(auto = false) {
        if (!isPlaying || ending) return;
        ending = true; clearTimeout(stopTimer); stopTimer = null;
        status.textContent = auto ? '播放時間到了，聲音正在慢慢淡出。' : '聲音正在慢慢淡出。'; updateClock();
        const oldCtx = ctx, finishIn = auto ? 30 : 8;
        if (oldCtx && masterGain) { masterGain.gain.cancelScheduledValues(oldCtx.currentTime); masterGain.gain.setValueAtTime(masterGain.gain.value, oldCtx.currentTime); masterGain.gain.linearRampToValueAtTime(0, oldCtx.currentTime + finishIn); }
        stopTimer = setTimeout(() => cleanup(), finishIn * 1000);
      }
      function changeFrequencies() {
        updateReadout(); savePrefs();
        if (ctx && leftOsc && rightOsc) { smoothParam(leftOsc.frequency, carrier()-beat()/2); smoothParam(rightOsc.frequency, carrier()+beat()/2); }
      }

      presets.forEach((button) => button.addEventListener('click', () => { beatRange.value = button.dataset.beat; changeFrequencies(); }));
      beatRange.addEventListener('input', changeFrequencies); $('carrierSelect').addEventListener('change', changeFrequencies);
      volumeRange.addEventListener('input', () => { updateReadout(); if (toneGain) smoothParam(toneGain.gain, Number(volumeRange.value)); savePrefs(); });
      noiseVolume.addEventListener('input', () => { updateReadout(); if (noiseGain && $('noiseToggle').checked) smoothParam(noiseGain.gain, Number(noiseVolume.value)); savePrefs(); });
      $('noiseToggle').addEventListener('change', () => { $('noiseControls').classList.toggle('hidden', !$('noiseToggle').checked); setNoiseEnabled($('noiseToggle').checked); savePrefs(); });
      $('noiseType').addEventListener('change', () => { refreshNoise(); savePrefs(); });
      $('timerSelect').addEventListener('change', () => { savePrefs(); if (isPlaying && !ending) { clearTimeout(stopTimer); const mins=Number($('timerSelect').value); stopAt=mins ? Date.now()+mins*60000 : 0; if (mins) stopTimer=setTimeout(() => fadeOut(true), Math.max(1000, mins*60000-30000)); updateClock(); } });
      playButton.addEventListener('click', () => { if (!isPlaying) startAudio(); else fadeOut(false); });
      $('noiseControls').classList.toggle('hidden', !$('noiseToggle').checked); updateReadout();
    })();
  </script>
</body>
</html>
